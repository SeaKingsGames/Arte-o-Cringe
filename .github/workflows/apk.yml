# Construye el APK de Arte o Cringe cada vez que subes cambios a GitHub.
# Para descargarlo: pestaña Actions → la ejecución más reciente → "arte-o-cringe-apk".
name: APK de Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar Capacitor
        run: npm install

      - name: Copiar el juego a la app
        run: node copiar-web.mjs

      - name: Crear el proyecto de Android
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: movil/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: arte-o-cringe-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
