# Construye Arte o Cringe para Android cada vez que subes cambios a GitHub.
# Para descargarlo: pestaña Actions → la ejecución más reciente → sección "Artifacts".
#   arte-o-cringe-apk        → APK de prueba, para instalar en tu celular.
#   arte-o-cringe-playstore  → AAB firmado para subir a Google Play (solo si configuraste la llave).
#   arte-o-cringe-firmado    → APK firmado con tu llave (solo si configuraste la llave).
# La llave se configura en Settings → Secrets and variables → Actions con dos secretos:
#   KEYSTORE_BASE64 y KEYSTORE_PASSWORD.
name: APK de Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      AOC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      AOC_KEY_ALIAS: arteocringe
      VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # v4 ya no pide el paquete 'tools' que Google retiró (era el error de la v3).
      - uses: android-actions/setup-android@v4

      - name: Instalar Capacitor
        run: npm install

      - name: Copiar el juego a la app
        run: node copiar-web.mjs

      - name: Crear el proyecto de Android
        run: npx cap add android

      - name: Sincronizar
        run: npx cap sync android

      - name: Preparar la llave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arte-o-cringe.jks"
          echo "AOC_KEYSTORE=$RUNNER_TEMP/arte-o-cringe.jks" >> "$GITHUB_ENV"

      # El script va aquí mismo para que no dependa de subir otro archivo.
      - name: Versión y firma
        run: |
          cat > preparar-android.mjs <<'EOF'
          // Ajusta el proyecto de Android que genera Capacitor antes de compilar:
          //  - versionCode: un número que sube solo en cada compilación (Google Play exige que siempre suba).
          //  - versionName: la "version" de package.json (la que ven los jugadores).
          //  - Firma: si existe la variable AOC_KEYSTORE, la versión release se firma con tu llave.
          import { readFileSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const aqui = dirname(fileURLToPath(import.meta.url));
          const ruta = join(aqui, 'android', 'app', 'build.gradle');
          const pkg = JSON.parse(readFileSync(join(aqui, 'package.json'), 'utf8'));
          let g = readFileSync(ruta, 'utf8');

          function cambiar(antes, despues, que) {
            if (!antes.test(g)) throw new Error(`No encontré ${que} en build.gradle. ¿Cambió la plantilla de Capacitor?`);
            g = g.replace(antes, despues);
          }

          const code = parseInt(process.env.VERSION_CODE || '1', 10);
          if (!(code >= 1 && code < 2100000000)) throw new Error('VERSION_CODE inválido: ' + process.env.VERSION_CODE);
          cambiar(/versionCode \d+/, `versionCode ${code}`, 'versionCode');
          cambiar(/versionName "[^"]*"/, `versionName "${pkg.version}"`, 'versionName');

          if (process.env.AOC_KEYSTORE) {
            cambiar(/\n    buildTypes \{/, `
              signingConfigs {
                  release {
                      storeFile file(System.getenv("AOC_KEYSTORE"))
                      storePassword System.getenv("AOC_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("AOC_KEY_ALIAS")
                      keyPassword System.getenv("AOC_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {`, 'buildTypes');
            cambiar(/(\n        release \{\n)(?!            storeFile)/, '$1            signingConfig signingConfigs.release\n', 'buildTypes.release');
          }

          writeFileSync(ruta, g);
          console.log(`Android listo: versionCode ${code}, versionName ${pkg.version}, ${process.env.AOC_KEYSTORE ? 'con firma' : 'sin firma (solo APK de prueba)'}`);
          EOF
          node preparar-android.mjs

      - name: Compilar
        working-directory: movil/android
        run: |
          if [ -n "$AOC_KEYSTORE" ]; then
            ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: arte-o-cringe-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: env.AOC_KEYSTORE != ''
        with:
          name: arte-o-cringe-playstore
          path: movil/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.AOC_KEYSTORE != ''
        with:
          name: arte-o-cringe-firmado
          path: movil/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Borrar la llave del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/arte-o-cringe.jks"
